[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-modal-retrieval-reference"
version = "0.1.0"
description = "License-safe reference modules and literature records for robust cross-modal retrieval"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

